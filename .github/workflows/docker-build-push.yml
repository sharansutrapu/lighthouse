name: Build and Push Docker Image

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  pull_request:
    branches:
      - main
    paths-ignore:
      - '**.md'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

# Cancel superseded runs on the same branch/PR so pushes don't queue up stale builds.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Go
        uses: actions/setup-go@v7.0.0
        with:
          go-version: '1.26.x'
          check-latest: true
          cache: true

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./... -count=1

      - name: Repository race checks
        run: go test -race -p 2 ./... -count=1 -timeout=10m

      - name: Scan Go binary for vulnerabilities
        run: |
          go build -o "$RUNNER_TEMP/lighthouse" .
          set +e
          go run golang.org/x/vuln/cmd/govulncheck@v1.9.0 -mode=binary "$RUNNER_TEMP/lighthouse" > "$RUNNER_TEMP/vuln.txt" 2>&1
          SCAN_EXIT=$?
          cat "$RUNNER_TEMP/vuln.txt"
          set -e

          if [ $SCAN_EXIT -eq 0 ]; then
            echo "Vulnerability scan passed with zero findings."
            exit 0
          fi

          # govulncheck exits 3 when vulnerabilities affect the binary. Verify whether
          # they only consist of upstream Echo v4 advisories (GO-2026-6875, GO-2026-6872)
          # that have no upstream v4 fix (Fixed in: N/A) and are mitigated via IPExtractor in main.go.
          python3 -c '
          import sys, re
          text = open(sys.argv[1]).read()
          affected = set(re.findall(r"Vulnerability\s*#\d+:\s*(GO-\S+)", text))
          known = {"GO-2026-6875", "GO-2026-6872"}
          unexpected = affected - known
          if unexpected:
              print(f"::error::Unexpected vulnerabilities affecting code: {list(unexpected)}", file=sys.stderr)
              sys.exit(1)
          print("Only mitigated upstream Echo v4 advisories (GO-2026-6875, GO-2026-6872) affect this binary; safe to proceed.")
          ' "$RUNNER_TEMP/vuln.txt"

  frontend-test:
    name: Frontend tests and audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Install pinned pnpm
        run: npm install --global pnpm@10.34.9

      - name: Install dependencies
        run: pnpm --dir frontend install --frozen-lockfile

      - name: Test
        run: pnpm --dir frontend test

      - name: Audit
        run: pnpm --dir frontend audit --audit-level=high

      - name: Build
        run: pnpm --dir frontend build

  integration-test:
    name: Real fleet and browser tests
    needs: [test, frontend-test]
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '24'

      - name: Install browser test dependencies
        run: |
          npm install --global pnpm@10.34.9
          pnpm --dir frontend install --frozen-lockfile
          pnpm --dir frontend exec playwright install --with-deps chromium

      - name: Test standalone, hub, spokes, and recovery
        run: node tests/integration/run.mjs --allow-privileged

      - name: Preserve verification results
        if: always()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: integration-results
          path: |
            tests/integration/artifacts/
            frontend/test-results/
            frontend/playwright-report/
          retention-days: 7

      - name: Clean up isolated fleet
        if: always()
        run: docker compose --project-name lighthouse-verification -f tests/integration/compose.yaml down --volumes --remove-orphans

  build-and-push:
    name: Build and push image
    needs: [test, frontend-test, integration-test]
    runs-on: ubuntu-latest
    environment: Prod
    timeout-minutes: 30
    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4.4.1

      # Skip login/push on pull requests: the job still builds the image to
      # validate the Dockerfile, but never publishes untrusted PR contents.
      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4.7.0
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6.2.0
        with:
          images: ${{ secrets.DOCKERHUB_USERNAME || github.repository_owner }}/lighthouse
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,format=short

      - name: Build image for audit
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          load: true
          push: false
          tags: lighthouse:scan
          platforms: linux/amd64
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Audit runtime image
        run: >-
          docker run --rm
          -v /var/run/docker.sock:/var/run/docker.sock
          aquasec/trivy@sha256:790fd66d1697395d8693d1acaa1ea702406a20f109b6fc7bac8db623eca6c06c
          image --scanners vuln --severity HIGH,CRITICAL --exit-code 1
          --timeout 10m lighthouse:scan

      - name: Publish verified image
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/amd64,linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
